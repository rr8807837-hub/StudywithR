<!DOCTYPE html>
<html>
<head>
  <title>Feedback Required</title>
</head>

<body style="text-align:center; font-family:Arial; padding:40px;">

  <h2>📝 Please give feedback to continue</h2>

  <!-- Your actual form -->
  <iframe 
    src="https://form.svhrt.com/69d1dc310ade6f5ad2b31837"
    width="100%" 
    height="500px"
    style="border:none;">
  </iframe>

  <br><br>

  <br><br>

<label style="font-size:18px;">
  <input type="checkbox" id="confirmCheck">
  I have filled and submitted the feedback form
</label>

<br><br>

<button id="submitBtn" onclick="goNext()" disabled
style="padding:10px 20px; font-size:18px; background:gray; color:white; border:none; border-radius:5px;">
  Submit & Continue →
</button>

  <script>
const checkbox = document.getElementById("confirmCheck");
const button = document.getElementById("submitBtn");

checkbox.addEventListener("change", function() {
  if (this.checked) {
    button.disabled = false;
    button.style.background = "green";
  } else {
    button.disabled = true;
    button.style.background = "gray";
  }
});
</script>

</body>
</html>
